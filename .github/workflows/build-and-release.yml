name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and run tests
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Generate SHA-256 checksum
        run: sha256sum target/php-payload-editor-0.1.3.jar > target/php-payload-editor-0.1.3.jar.sha256
      - name: Upload JAR as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: PHP-Payload-Editor-JAR
          path: |
            target/php-payload-editor-0.1.3.jar
            target/php-payload-editor-0.1.3.jar.sha256
          if-no-files-found: error
      - name: Publish downloadable GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Development build {0}', github.run_number) }}
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
          files: |
            target/php-payload-editor-0.1.3.jar
            target/php-payload-editor-0.1.3.jar.sha256
